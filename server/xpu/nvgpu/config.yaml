# GPU Management System Configuration

# Server Configuration
server:
  host: "0.0.0.0"
  port: 8080
  workers: 1
  reload: false
  log_level: "INFO"

# GPU Manager Configuration
gpu_manager:
  refresh_interval_seconds: 10
  max_task_wait_minutes: 30
  log_dir: "server/logs/xpu/nvgpu"

# GPU Selection (optional)
# Uncomment and modify to restrict visible GPUs
# gpu_selection:
#   visible_devices: [0, 1, 2, 3]  # List of GPU IDs to use
#   preferred_types: ["H100", "L20"]  # Preferred GPU types

# Task Configuration
tasks:
  # Default memory estimates for different task types (MB)
  default_memory_estimates:
    correctness: 10000
    performance: 40000
    comprehensive: 40000
  
  # Default timeouts
  default_timeouts:
    functional_tasks: 15  # minutes
    performance_tasks: 30  # minutes
    comprehensive_tasks: 60  # minutes

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # File logging (optional)
  file:
    path: "server/logs/xpu/nvgpu/gpu_manager.log"
    max_size_mb: 100
    backup_count: 5

# Monitoring Configuration
monitoring:
  # Health check intervals
  health_check_interval: 30  # seconds
  
  # Performance metrics
  collect_metrics: true
  metrics_retention_hours: 24

# GPU Type Specifications
# (These are built-in but can be overridden)
gpu_specs:
  H100:
    memory_gb: 80
    compute_capability: "9.0"
    tensor_cores: true
    max_power_w: 350
    memory_bandwidth_gbps: 2000
    fp32_tflops: 51.0
    fp16_tflops: 102.0
    fp8_tflops: 204.0
  
  L20:
    memory_gb: 48
    compute_capability: "8.6"
    tensor_cores: true
    max_power_w: 350
    memory_bandwidth_gbps: 864
    fp32_tflops: 59.7
    fp16_tflops: 119.4
    fp8_tflops: 238.8
  
  RTX_6000_Ada:
    memory_gb: 48
    compute_capability: "8.9"
    tensor_cores: true
    max_power_w: 300
    memory_bandwidth_gbps: 960
    fp32_tflops: 91.1
    fp16_tflops: 182.2
    fp8_tflops: 364.4

# Kernel Testing Configuration
kernel_testing:
  # Supported comparison types
  comparison_types:
    - "triton_vs_torch"
    - "triton_vs_cuda"
    - "cuda_vs_torch"
    - "comprehensive"
  
  # Default evaluation configuration
  evaluation:
    timeout_seconds: 300
    benchmark_warmup_runs: 5
    benchmark_timing_runs: 20
    use_multiprocessing: true
    max_workers: 10

# Example GPU Environment Configurations
environments:
  # All GPUs (default)
  all_gpus:
    visible_devices: [0, 1]  # Use all available
    description: "Use all available GPUs"
  
  # # H100 only
  # h100_only:
  #   visible_devices: [2, 3, 4, 5]  # Assuming H100s are GPUs 0-3
  #   description: "Use H100 GPUs for high-performance tasks"
  
  # # L20 only  
  # l20_only:
  #   visible_devices: [0, 1]  # Assuming L20s are GPUs 4-5
  #   description: "Use L20 GPUs for development and testing"
  
  a6000_only:
    visible_devices: [0, 1]  # Assuming A6000s are GPUs 0-1
    description: "Use A6000 GPUs for high-performance tasks"
  
  # a100_104_only:
  #   visible_devices: [0]  # Assuming A100s are GPUs 0-1
  #   description: "Use A100 GPUs for high-performance tasks"
  
  # Single GPU for debugging
  single_gpu:
    visible_devices: [0]
    description: "Use single GPU for debugging"

# Example Usage Scenarios
usage_examples:
  development:
    description: "Development and testing setup"
    config:
      gpu_manager:
        refresh_interval_seconds: 5
        max_task_wait_minutes: 10
      tasks:
        default_timeouts:
          functional_tasks: 5
          performance_tasks: 10
  
  production:
    description: "Production environment setup"
    config:
      gpu_manager:
        refresh_interval_seconds: 10
        max_task_wait_minutes: 30
      server:
        workers: 2
        log_level: "WARNING"
  
  benchmark:
    description: "Benchmarking and performance evaluation"
    config:
      gpu_manager:
        refresh_interval_seconds: 15
        max_task_wait_minutes: 60
      tasks:
        default_timeouts:
          performance_tasks: 60
          comprehensive_tasks: 120

# GPU ID映射配置 - 解决CUDA_VISIBLE_DEVICES和nvidia-smi ID不一致问题
# 格式: cuda_device_id: nvidia_smi_device_id
gpu_id_mapping:
  0: 0  # CUDA device 0 -> nvidia-smi GPU 0 (RTX 6000 Ada)
  1: 1  # CUDA device 1 -> nvidia-smi GPU 1 (RTX 6000 Ada)

# 管理器设置
manager:
  refresh_interval_seconds: 10
  max_task_wait_minutes: 30
  log_level: INFO

# 任务队列设置
task_queue:
  max_wait_time_minutes: 30
  functional_memory_limit_ratio: 0.67  # 功能任务最多使用67%GPU内存
  performance_memory_limit_ratio: 0.05  # 性能任务要求GPU内存使用<5%

# API服务器设置
api_server:
  host: "0.0.0.0"
  port: 8081
  workers: 1
  log_level: INFO 