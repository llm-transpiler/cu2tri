# GPU Management System Configuration

# API Server Configuration
api_server:
  host: "0.0.0.0"
  port: 8080
  log_level: "INFO"
  log_dir: "logs/xpu/nvgpu_new"

# Task Dispatcher Configuration
task_dispatcher:
  # List of GPU IDs to exclude from management
  # Example: [0, 1] excludes GPU 0 and GPU 1
  excluded_gpu_ids: []
  
  # Maximum parallel shared tasks per GPU
  # Exclusive tasks always run alone
  max_parallel_task_num: 4
  
  # GPU manager refresh interval (seconds)
  gpu_manager_refresh_interval: 30
  
  # CUDA error cooldown period in seconds
  error_cooldown_seconds: 30

# GPU Manager Configuration
gpu_manager:
  # Status refresh interval (seconds)
  status_refresh_interval: 30

# CUDA Error Protection Configuration
cuda_error_protection:
  # Enable/disable CUDA error cooldown mechanism
  enabled: true
  
  # Cooldown period in seconds after CUDA errors
  cooldown_seconds: 30
  
  # CUDA error detection patterns
  error_patterns:
    - "cuda"
    - "gpu"
    - "device"
    - "out of memory"
    - "nvml"
    - "runtime error"
    - "driver error"
    - "kernel launch"
    - "device assert"
    - "illegal memory access"
  
  # Maximum error count before extended cooldown
  max_error_count: 10
  
  # Extended cooldown multiplier (applied after max_error_count)
  extended_cooldown_multiplier: 2.0

# GPU Health Check Configuration
gpu_health_check:
  # Enable/disable GPU health monitoring
  enabled: true
  
  # Health check is error-driven, not periodic
  # Only runs after cooldown period expires
  
  # Health check timeout in seconds
  timeout_seconds: 30
  
  # Health check isolation settings
  isolation:
    # Use subprocess for complete isolation
    use_subprocess: true
    
    # Clean environment variables
    clean_environment: true
    
    # Force memory cleanup
    force_cleanup: true
  
  # Health check operations
  operations:
    # Basic tensor operations
    tensor_add: true
    
    # Matrix multiplication
    matrix_multiply: true
    
    # Device properties query
    device_properties: true
    
    # Memory allocation test
    memory_test: true
    
    # Test tensor sizes (small to avoid memory issues)
    test_tensor_size: [2, 2]

# Task Queue Configuration
task_queue:
  # Maximum number of completed tasks to keep in history
  max_completed_history: 1000
  
  # Task expiration time (minutes)
  default_max_wait_time_minutes: 30

# GPU Availability Criteria
gpu_availability:
  # Maximum memory usage ratio (0.0 - 1.0)
  max_memory_usage_ratio: 0.8
  
  # Maximum temperature (Celsius)
  max_temperature_c: 85

# Task Types
task_types:
  exclusive:
    description: "Requires exclusive GPU access (独占GPU)"
    examples:
      - "Model training"
      - "Performance benchmarking"
      - "Memory-intensive computations"
    
  shared:
    description: "Can share GPU with other shared tasks (共享GPU)"
    examples:
      - "Model inference"
      - "Batch processing"
      - "Development and testing"

# Example Usage Scenarios
examples:
  # Training workload - exclusive tasks
  training:
    description: "Model training requiring exclusive GPU access"
    task_type: "exclusive"
    max_parallel_task_num: 1  # Ignored for exclusive tasks
  
  # Inference workload - shared tasks
  inference:
    description: "Multiple inference tasks sharing GPUs"
    task_type: "shared"
    max_parallel_task_num: 8  # Allow up to 8 concurrent inference tasks
  
  # Mixed workload
  mixed:
    description: "Mix of training and inference"
    notes: |
      - Exclusive tasks (training) will wait for all shared tasks to complete
      - Shared tasks (inference) can run in parallel up to max_parallel_task_num
      - New shared tasks won't start if an exclusive task is waiting

# Logging Configuration
logging:
  # Log format
  format: "[%(levelname)s] - %(message)s"
  
  # Console logging
  console:
    enabled: true
    level: "INFO"
  
  # File logging
  file:
    enabled: true
    level: "DEBUG"
    # Log file rotation
    max_bytes: 10485760  # 10MB
    backup_count: 5

# API Endpoints Summary
api_endpoints:
  # Task Management
  - "POST /tasks/submit - Submit a task (specify task_type and optionally gpu_id)"
  - "GET /tasks/{task_id} - Get task status"
  - "DELETE /tasks/{task_id} - Cancel a task"
  - "GET /tasks - Get system-wide task statistics"
  
  # System Information
  - "GET /status - Get comprehensive system status (includes cooldown/health info)"
  - "GET /gpus - Get all GPU statuses"
  - "GET /gpus/available - Get available GPU IDs"
  - "GET /task-types - Get available task types"
  
  # Health Check & Error Protection
  - "GET /health - Health check endpoint"
  - "GET /gpus/{gpu_id}/health - Get specific GPU health status"
  - "GET /protection/status - Get CUDA error protection status"
  - "GET / - Service information"

# Task Submission Examples
task_submission_examples:
  exclusive_task:
    task_type: "exclusive"
    name: "Model Training"
    description: "Train a large model"
    module_path: "my_module"
    function_name: "train_model"
    kwargs:
      epochs: 100
      batch_size: 64
    gpu_id: null  # Auto-select GPU
  
  shared_task:
    task_type: "shared"
    name: "Inference Batch"
    description: "Run inference on a batch"
    module_path: "my_module"
    function_name: "run_inference"
    kwargs:
      batch_size: 32
    gpu_id: 1  # Use specific GPU
  
  # Example task that might cause CUDA errors (for testing)
  error_test_task:
    task_type: "exclusive"
    name: "CUDA Error Test"
    description: "Task that simulates CUDA errors for testing cooldown"
    module_path: "server.xpu.nvgpu_new.examples.error_handling_example"
    function_name: "simulate_cuda_error_task"
    kwargs:
      error_type: "memory"
    gpu_id: null  # Auto-select GPU

# Load Balancing
load_balancing:
  # Weights for GPU selection score calculation
  memory_weight: 50
  utilization_weight: 0.3
  temperature_weight: 0.2
  
  # Queue weights
  exclusive_queue_weight: 20
  shared_queue_weight: 5
  running_exclusive_weight: 50
  running_shared_weight: 10 


# GPU ID映射配置 - 解决CUDA_VISIBLE_DEVICES和nvidia-smi ID不一致问题
# 格式: cuda_device_id: nvidia_smi_device_id
gpu_id_mapping:
  0: 0  # CUDA device 0 -> nvidia-smi GPU 0 (RTX 6000 Ada)
  1: 1  # CUDA device 1 -> nvidia-smi GPU 1 (RTX 6000 Ada)

# GPU规格配置 - 可以从配置文件中加载GPU规格信息
gpu_specs:
  # H100 PCIe 80GB版本
  "H100_PCIE_80G":
    memory_gb: 80
    compute_capability: "9.0"
    tensor_cores: true
    max_power_w: 350
    memory_bandwidth_gbps: 2000
  
  # A100 PCIe 40GB版本
  "A100_PCIE_40G":
    memory_gb: 40
    compute_capability: "8.0"
    tensor_cores: true
    max_power_w: 250
    memory_bandwidth_gbps: 1555
  
  # RTX 6000 Ada Generation
  "RTX_6000_Ada":
    memory_gb: 48
    compute_capability: "8.9"
    tensor_cores: true
    max_power_w: 300
    memory_bandwidth_gbps: 960
  
  # L20 GPU
  "L20":
    memory_gb: 48
    compute_capability: "8.9"
    tensor_cores: true
    max_power_w: 275
    memory_bandwidth_gbps: 864
  
  # Unknown GPU类型的默认规格
  "UNKNOWN":
    memory_gb: 0
    compute_capability: "0.0"
    tensor_cores: false
    max_power_w: 0
    memory_bandwidth_gbps: 0
