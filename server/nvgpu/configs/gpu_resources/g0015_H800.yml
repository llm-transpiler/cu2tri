# Server settings
server:
  auto_register_gpus: true  # Auto-register enabled GPUs on startup
  use_gpu_uuid: true        # Use UUID for GPU identification (more reliable)

# Notes:
# - logical_id: The ID used by this scheduling system (0, 1, 2, ...)
# - nvidia_smi_id: The GPU index shown in nvidia-smi command
# - cuda_visible_id: The ID to use when setting CUDA_VISIBLE_DEVICES
# 
# In most cases, all three IDs are the same, but they can differ in some
# multi-GPU systems or when using MIG (Multi-Instance GPU) partitions.
#
# Example of different mappings:
# If your system has nvidia-smi showing [0, 1] but CUDA sees them as [1, 0]:
#   logical_id: 0, nvidia_smi_id: 0, cuda_visible_id: 1
#   logical_id: 1, nvidia_smi_id: 1, cuda_visible_id: 0

