    nvidia_smi_id: 0         # GPU index shown in nvidia-smi
    cuda_visible_id: 0       # CUDA_VISIBLE_DEVICES mapping
    name: "NVIDIA H800"
    uuid: "GPU-a1f9189c-63e6-c9e9-a4e8-1d9e964a864a"
    memory_gb: 80            # Memory in GB
    enabled: false            # Whether to register this GPU on startup
    default_mode: "shared"   # Default mode: "shared" or "exclusive"
    memory_threshold: 0.75   # Memory usage threshold (0-1)
    max_concurrent_tasks: 10 # Max concurrent tasks in shared mode
  
